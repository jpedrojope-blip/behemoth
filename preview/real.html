<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Behemoth — Dados reais</title><style>body{margin:0;background:#f5f7fb;color:#142746;font:14px Arial}.app{display:flex;min-height:100vh}.side{width:235px;background:#fff;border-right:1px solid #e3e9f2;padding:25px 14px;position:fixed;inset:0 auto 0 0}.brand{font-weight:bold;font-size:21px;margin:0 12px 34px}.mark{background:#142746;color:#fff;padding:7px 10px;border-radius:9px;margin-right:8px}.nav{display:block;border:0;background:none;padding:12px;width:100%;text-align:left;color:#66758d;border-radius:9px;cursor:pointer}.nav.active{background:#edf3ff;color:#316cf4;font-weight:bold}.label{font-size:10px;letter-spacing:2px;color:#a0aabc;margin:25px 12px 9px}.main{margin-left:235px;flex:1}.top{height:70px;background:#fff;border-bottom:1px solid #e3e9f2;padding:0 5%;display:flex;justify-content:space-between;align-items:center;color:#8490a2}.wrap{max-width:1300px;margin:auto;padding:40px 5%}.head{display:flex;justify-content:space-between;align-items:start;margin-bottom:22px}h1{font-size:38px;letter-spacing:-2px;margin:10px 0}.sub,small{color:#8490a2}.btn{border:0;background:#316cf4;color:#fff;padding:11px 15px;border-radius:9px;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:25px 0 17px}.kpi,.card{background:#fff;border:1px solid #e3e9f2;border-radius:15px;padding:20px}.kpi{min-height:120px}.kpi.blue{background:#23416e;color:#fff}.kpi.cream{background:#fff0dd}.kpi.lav{background:#eeeaff}.kpi.mint{background:#dcf3eb}.num{font-size:26px;font-weight:bold;margin:20px 0}.green{color:#209a75;font-size:11px}.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:17px}.chart{height:240px;margin-top:22px;background:repeating-linear-gradient(to bottom,transparent 0,transparent 47px,#edf0f5 48px);position:relative}.chart svg{width:100%;height:100%}.form{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0;padding:15px;background:#f8faff;border-radius:10px}.form input,.form select{padding:10px;border:1px solid #dce3ee;border-radius:8px;min-width:130px}.table{width:100%;border-collapse:collapse}.table td,.table th{text-align:left;padding:14px 8px;border-bottom:1px solid #e3e9f2;font-size:12px}.table th{font-size:10px;color:#a0aabc;letter-spacing:1px}.badge{background:#e0f5ed;color:#218c6e;padding:5px 8px;border-radius:15px;font-size:10px}.notice{padding:16px;background:#fff6df;color:#805d19;border-radius:10px;margin:18px 0}.login{max-width:430px;margin:12vh auto;background:#fff;padding:30px;border:1px solid #e3e9f2;border-radius:16px}.login input{display:block;width:100%;padding:12px;margin:10px 0;border:1px solid #dce3ee;border-radius:8px}.toast{position:fixed;right:20px;bottom:20px;background:#172c50;color:#fff;padding:13px 17px;border-radius:9px}@media(max-width:850px){.side{display:none}.main{margin:0}.cards{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}@media(max-width:480px){.cards{grid-template-columns:1fr}h1{font-size:30px}}</style><div id="root"></div><script>
const SUPA="https://hihkuzdyxycoehjjlrwb.supabase.co",KEY="sb_publishable_DaThAWNvMAd3xi4Py5uOfQ_3HKUVxU9";let session=localStorage.getItem("behemoth-session"),rows=[];
const money=n=>n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"}),api=async(path,init={})=>{let r=await fetch(SUPA+"/rest/v1/"+path,{...init,headers:{apikey:KEY,Authorization:"Bearer "+(session||KEY),"Content-Type":"application/json",...(init.headers||{})}});if(!r.ok)throw Error(await r.text());return r.json()};
function layout(content){root.innerHTML='<div class=app><aside class=side><div class=brand><span class=mark>B</span>behemoth</div><button class="nav active" data-v="home">▦ &nbsp; Início</button><button class=nav data-v="finance">▣ &nbsp; Financeiro</button><button class=nav data-v="team">♙ &nbsp; Equipe</button><button class=nav data-v="calendar">◫ &nbsp; Calendário</button><button class=nav data-v="meetings">▤ &nbsp; Reuniões</button><div class=label>CONTA</div><button class=nav onclick="logout()">↪ &nbsp; Sair</button></aside><main class=main><header class=top><span>Acme Corp / <b id=crumb>Behemoth</b></span><span>Sincronização Supabase</span></header><div class=wrap>'+content+'</div></main></div>';document.querySelectorAll(".nav[data-v]").forEach(b=>b.onclick=()=>{document.querySelectorAll(".nav").forEach(x=>x.classList.remove("active"));b.classList.add("active");({home,finance,team,calendar,meetings}[b.dataset.v])();})}
async function home(){let inc=rows.filter(x=>x.kind==="INCOME").reduce((s,x)=>s+Number(x.amount),0),out=rows.filter(x=>x.kind==="EXPENSE").reduce((s,x)=>s+Number(x.amount),0),p=inc-out;layout('<div class=head><div><div class=label>VISÃO EXECUTIVA</div><h1>Dados reais da sua empresa</h1><p class=sub>'+(rows.length?"Indicadores calculados a partir do banco.":"Nenhum lançamento encontrado. Comece no Financeiro.")+'</p></div></div><div class=cards><div class="kpi blue">Receita<div class=num>'+money(inc)+'</div><span class=green>Supabase</span></div><div class="kpi cream">Custos<div class=num>'+money(out)+'</div><span class=green>Supabase</span></div><div class="kpi lav">Lançamentos<div class=num>'+rows.length+'</div><span class=green>registros</span></div><div class="kpi mint">Lucro<div class=num>'+money(p)+'</div><span class=green>'+ (inc?Math.round(p/inc*100):0)+'% margem</span></div></div><div class=card><div class=label>RESULTADO</div><h2>Performance financeira real</h2><div class=chart id=chart></div></div>');drawChart()}
function drawChart(){let sums={};rows.forEach(x=>{let m=(x.date||"").slice(0,7);sums[m]=(sums[m]||0)+(x.kind==="INCOME"?1:-1)*Number(x.amount)});let vals=Object.values(sums),max=Math.max(...vals.map(Math.abs),1),pts=vals.map((v,i)=>(i*(100/Math.max(vals.length-1,1)))+","+(110-v/max*90)).join(" ");chart.innerHTML=vals.length?'<svg viewBox="0 0 100 120" preserveAspectRatio="none"><polyline points="'+pts+'" fill="none" stroke="#316cf4" stroke-width="1.8"/><polyline points="0,120 '+pts+' 100,120" fill="#dbe7ff" opacity=".55"/></svg>':'<div class=notice>Adicione lançamentos no Financeiro para ativar o gráfico.</div>'}
async function finance(){layout('<div class=head><div><div class=label>DADOS FINANCEIROS</div><h1>Financeiro</h1><p class=sub>Registros carregados diretamente do Supabase.</p></div><button class=btn onclick="toggle()">+ Lançamento</button></div><div id=form class=form style="display:none"><input id=desc placeholder="Descrição"><input id=amount type=number placeholder="Valor"><select id=kind><option value=INCOME>Receita</option><option value=EXPENSE>Despesa</option></select><input id=cat placeholder="Categoria"><button class=btn onclick="saveTx()">Salvar</button></div><div class=card><table class=table><thead><tr><th>DESCRIÇÃO</th><th>CATEGORIA</th><th>TIPO</th><th>VALOR</th><th>STATUS</th></tr></thead><tbody>'+rows.map(x=>'<tr><td>'+x.description+'</td><td>'+x.category+'</td><td>'+x.kind+'</td><td>'+money(Number(x.amount))+'</td><td><span class=badge>'+x.status+'</span></td></tr>').join("")+'</tbody></table></div>')}
function toggle(){form.style.display=form.style.display==="none"?"flex":"none"}async function saveTx(){if(!desc.value||!amount.value)return toast("Preencha descrição e valor");try{let x=await api("transactions",{method:"POST",body:JSON.stringify({description:desc.value,amount:Number(amount.value),kind:kind.value,category:cat.value||"Outros",status:"PENDING"})});rows.push(x[0]||x);toast("Lançamento salvo");finance()}catch(e){toast("Supabase recusou: faça login e vincule uma empresa")}}
function team(){layout('<div class=label>FORÇA OPERACIONAL</div><h1>Equipe & Agentes</h1><div class=card><div class=notice>Esta tela exibirá os membros reais cadastrados na tabela team_members.</div><button class=btn onclick="toast(\\'Cadastro conectado ao Supabase em seguida\\')">+ Adicionar membro</button></div>')}function calendar(){layout('<div class=label>OPERAÇÃO</div><h1>Calendário</h1><div class=card><div class=notice>Eventos e tarefas serão sincronizados aqui.</div><button class=btn onclick="toast(\\'Calendário conectado ao Supabase em seguida\\')">+ Novo evento</button></div>')}function meetings(){layout('<div class=label>MEMÓRIA EMPRESARIAL</div><h1>Reuniões</h1><div class=card><div class=notice>Reuniões, notas, transcrições e action items serão sincronizados aqui.</div><button class=btn onclick="toast(\\'Sala de reunião conectada ao Supabase em seguida\\')">+ Nova reunião</button></div>')}function toast(t){let x=document.createElement("div");x.className="toast";x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),2300)}function logout(){localStorage.removeItem("behemoth-session");location.reload()}async function login(){try{let r=await fetch(SUPA+"/auth/v1/token?grant_type=password",{method:"POST",headers:{"Content-Type":"application/json",apikey:KEY},body:JSON.stringify({email:email.value,password:password.value})});if(!r.ok)throw Error();let j=await r.json();localStorage.setItem("behemoth-session",j.access_token);session=j.access_token;start()}catch(e){err.textContent="Login inválido ou usuário ainda não criado no Supabase Auth."}}async function start(){if(!session){root.innerHTML='<div class=login><div class=brand><span class=mark>B</span>behemoth</div><h1>Entrar</h1><p class=sub>Use o usuário criado no Supabase Auth.</p><input id=email placeholder="E-mail"><input id=password type=password placeholder="Senha"><button class=btn onclick="login()">Entrar</button><p class=sub id=err></p></div>';return}try{rows=await api("transactions?select=*&order=date.desc");}catch(e){rows=[]}home()}start();
</script></html>
